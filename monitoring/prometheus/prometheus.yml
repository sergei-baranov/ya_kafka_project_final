# Синхронизируйте порт shop-api с SHOP_API_WEB_PORT (.env): job shop_api и blackbox_shop_api.
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: postgres_exporter
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: kafka_exporter_stage
    static_configs:
      - targets: ["kafka-exporter:9308"]

  - job_name: kafka_connect_jmx
    static_configs:
      - targets: ["kafka-connect:9876"]

  - job_name: shop_api
    static_configs:
      - targets: ["shop-api-app:6077"]
    metrics_path: /metrics
    scheme: http

  - job_name: blackbox_ksql
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://ksqldb-server:8088/info
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - target_label: __address__
        replacement: blackbox-exporter:9115
      - source_labels: [__param_target]
        target_label: instance

  - job_name: blackbox_shop_api
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://shop-api-app:6077/get-block-words/
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - target_label: __address__
        replacement: blackbox-exporter:9115
      - source_labels: [__param_target]
        target_label: instance
