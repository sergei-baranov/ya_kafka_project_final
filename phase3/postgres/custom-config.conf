listen_addresses = '*'
wal_level = 'logical'
max_wal_senders = 1
max_replication_slots = 1

# --- Память под лимит контейнера ~1 GiB (SERVICE_POSTGRES_LIMIT_MEMORY в compose) ---
# Ориентир: shop-api — пул до ~5 соединений + редкие ручные psql/UI.
shared_buffers = 256MB
effective_cache_size = 512MB
work_mem = 8MB
maintenance_work_mem = 128MB
max_connections = 50
# max_parallel_workers* — в образе debezium/postgres часть сборок не подхватывает эти имена;
# параллельные планы остаются по умолчанию сервера.

# WAL: при лимите RAM 1G max_wal_size = 4GB избыточен (пики при checkpoint / кэш)
max_wal_size = 1GB
min_wal_size = 80MB
checkpoint_timeout = 10min
